<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101116" />
    <title>Tiada sambungan · Aqsa Series</title>
    <style>
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; background: #101116; color: #f8f7f4; font: 16px/1.6 system-ui, sans-serif; }
      main { box-sizing: border-box; width: min(100%, 28rem); padding: 2rem; text-align: center; }
      img { width: 5rem; height: 5rem; border-radius: 1.4rem; }
      h1 { margin: 1.5rem 0 .5rem; font-size: 1.5rem; }
      p { margin: 0 0 1.5rem; color: #b9b9c1; }
      button { min-height: 2.75rem; border: 0; border-radius: 999px; padding: .7rem 1.5rem; background: #7a1f2b; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #e8d28a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.png" alt="" />
      <h1>Tiada sambungan internet</h1>
      <p>Sambungkan peranti anda ke internet untuk membuka Aqsa Series.</p>
      <button type="button" onclick="location.reload()">Cuba lagi</button>
    </main>
  </body>
</html>
